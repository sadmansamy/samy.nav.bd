<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JSON Script Generator</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 10px; }
        .item { display: flex; align-items: center; gap: 10px; background: #f4f4f4; padding: 10px; margin-bottom: 5px; border-radius: 4px; }
        .controls { margin-left: auto; display: flex; gap: 5px; }
        .input-area { display: flex; gap: 10px; margin-bottom: 20px; padding: 15px; background: #eef; border-radius: 4px; }
        input { padding: 8px; flex: 1; }
        pre { background: #333; color: #fff; padding: 15px; overflow-x: auto; border-radius: 4px; }
    </style>
</head>
<body>

    <h3>Add Item</h3>
    <div class="input-area">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="dis" placeholder="Description">
        <input type="text" id="img" placeholder="Image URL">
        <input type="text" id="url" placeholder="Main URL">
        <button onclick="addItem()">Add to List</button>
    </div>

    <h3>App List</h3>
    <div id="app-list"></div>

    <br>
    <button onclick="generateJSON()" style="padding: 10px 20px; font-weight: bold;">Generate JSON Script</button>
    <button onclick="copyToClipboard()" style="padding: 10px 20px;">Copy to Clipboard</button>
    
    <pre id="output"></pre>

    <script>
        let data = JSON.parse(localStorage.getItem('myApps')) || [];

        function render() {
            const list = document.getElementById('app-list');
            list.innerHTML = '';
            data.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <span><strong>${item.name || '---'}</strong></span>
                    <div class="controls">
                        <button onclick="move(${index}, -1)">↑</button>
                        <button onclick="move(${index}, 1)">↓</button>
                        <button onclick="del(${index})">X</button>
                    </div>`;
                list.appendChild(div);
            });
            localStorage.setItem('myApps', JSON.stringify(data));
        }

        function addItem() {
            const name = document.getElementById('name').value;
            if(!name) return;
            data.push({
                name: name,
                dis: document.getElementById('dis').value,
                img: document.getElementById('img').value,
                urls: [document.getElementById('url').value]
            });
            // Clear inputs
            document.getElementById('name').value = '';
            document.getElementById('dis').value = '';
            document.getElementById('img').value = '';
            document.getElementById('url').value = '';
            render();
        }

        function move(index, direction) {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < data.length) {
                [data[index], data[newIndex]] = [data[newIndex], data[index]];
                render();
            }
        }

        function del(index) {
            data.splice(index, 1);
            render();
        }

        function generateJSON() {
            document.getElementById('output').innerText = JSON.stringify(data, null, 2);
        }

        function copyToClipboard() {
            const text = document.getElementById('output').innerText;
            navigator.clipboard.writeText(text).then(() => alert("Copied to clipboard!"));
        }

        render();
    </script>
</body>
</html>
