<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Manager</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f9f9f9; }
        .input-group { display: flex; flex-direction: column; gap: 8px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, textarea { padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 12px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; }
        .item { background: #fff; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #007bff; }
        .controls button { margin-left: 5px; padding: 8px 12px; background: #eee; color: #333; }
        pre { background: #333; color: #0f0; padding: 15px; overflow-x: auto; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>

    <h3>Import Existing JSON</h3>
    <textarea id="importArea" style="width: 100%; height: 80px;" placeholder="Paste your existing JSON here..."></textarea>
    <button onclick="importJSON()" style="width: 100%; margin-top: 5px; background: #28a745;">Load to List</button>

    <h3>Add New Item</h3>
    <div class="input-group">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="dis" placeholder="Description">
        <input type="text" id="img" placeholder="Image URL">
        <input type="text" id="url" placeholder="Main URL">
        <button onclick="addItem()">Add to List</button>
    </div>

    <h3>Current List</h3>
    <div id="app-list"></div>

    <button onclick="generateJSON()" style="width: 100%; margin: 20px 0; background: #333;">Generate JSON Script</button>
    <button onclick="copyToClipboard()" style="width: 100%; background: #666;">Copy to Clipboard</button>
    <pre id="output"></pre>

    <script>
        let data = JSON.parse(localStorage.getItem('myApps')) || [];

        function render() {
            const list = document.getElementById('app-list');
            list.innerHTML = '';
            data.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <strong>${item.name}</strong>
                    <div class="controls">
                        <button onclick="move(${index}, -1)">↑</button>
                        <button onclick="move(${index}, 1)">↓</button>
                        <button onclick="del(${index})">X</button>
                    </div>`;
                list.appendChild(div);
            });
            localStorage.setItem('myApps', JSON.stringify(data));
        }

        function importJSON() {
            const val = document.getElementById('importArea').value;
            try {
                data = JSON.parse(val);
                render();
            } catch(e) { alert("Invalid JSON format"); }
        }

        function addItem() {
            const name = document.getElementById('name').value;
            if(!name) return;
            data.push({ name, dis: document.getElementById('dis').value, img: document.getElementById('img').value, urls: [document.getElementById('url').value] });
            document.getElementById('name').value = '';
            document.getElementById('dis').value = '';
            document.getElementById('img').value = '';
            document.getElementById('url').value = '';
            render();
        }

        function move(idx, dir) {
            const newIdx = idx + dir;
            if (newIdx >= 0 && newIdx < data.length) {
                [data[idx], data[newIdx]] = [data[newIdx], data[idx]];
                render();
            }
        }

        function del(idx) { data.splice(idx, 1); render(); }
        function generateJSON() { document.getElementById('output').innerText = JSON.stringify(data, null, 2); }
        function copyToClipboard() { navigator.clipboard.writeText(document.getElementById('output').innerText).then(() => alert("Copied!")); }

        render();
    </script>
</body>
</html>
