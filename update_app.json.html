<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern JSON Manager</title>
    <style>
        :root { --primary: #4f46e5; --danger: #ef4444; --bg: #f8fafc; --card: #ffffff; }
        /* Removed top padding and set margin to 0 for a flush top look */
        body { font-family: 'Segoe UI', sans-serif; padding: 0 15px 20px 15px; background-color: var(--bg); max-width: 600px; margin: auto; }
        
        /* Updated card to have bottom rounded corners only, no margin-top */
        .card { background: var(--card); padding: 20px; border-radius: 0 0 16px 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        h3 { margin: 15px 0; color: #1e293b; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; }
        button { padding: 12px; cursor: pointer; border: none; border-radius: 10px; width: 100%; color: white; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: var(--primary); }
        .url-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .plus-btn { width: 45px; height: 45px; background: #64748b; display: flex; align-items: center; justify-content: center; font-size: 20px; border-radius: 10px; }
        .item { background: var(--card); padding: 15px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        pre { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 12px; overflow-x: auto; font-size: 13px; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center; }
    </style>
</head>
<body>

    <div class="card">
        <input type="hidden" id="editIndex" value="-1">
        <input type="text" id="name" placeholder="App Name">
        <input type="text" id="dis" placeholder="Description">
        <input type="text" id="img" placeholder="Image URL">
        <div id="url-container">
            <div class="url-row"><input type="text" class="url-input" placeholder="URL 1"></div>
            <div class="url-row"><input type="text" class="url-input" placeholder="URL 2"></div>
            <div class="url-row">
                <input type="text" class="url-input" placeholder="URL 3">
                <button onclick="addUrlField()" class="plus-btn">+</button>
            </div>
        </div>
        <button id="saveBtn" onclick="saveItem()" class="btn-primary" style="margin-top:10px;">Add to List</button>
    </div>

    <div style="padding: 0 5px; display: flex; align-items: center; justify-content: space-between;">
        <h3>App List</h3>
        <button onclick="showImportModal()" style="width: auto; background: #10b981; padding: 8px 15px; font-size: 12px;">Import</button>
    </div>
    <div id="app-list"></div>

    <div style="padding: 0 5px;">
        <button onclick="generateJSON()" class="btn-primary" style="margin-top: 20px;">Generate JSON Script</button>
        <button onclick="copyToClipboard()" style="background: #475569; margin-top: 10px;">Copy to Clipboard</button>
        <pre id="output">JSON will appear here...</pre>
        <button onclick="showDeleteModal()" style="background: var(--danger); margin-top: 30px; margin-bottom: 30px;">Delete All</button>
    </div>

    <div id="importModal" class="modal">
        <div class="card" style="width: 85%; border-radius: 16px;">
            <h3>Import JSON</h3>
            <textarea id="importArea" rows="4" placeholder="Paste JSON here..."></textarea>
            <button onclick="importJSON()" class="btn-primary">Load Data</button>
            <button onclick="closeModal('importModal')" style="background: #94a3b8; margin-top:10px;">Cancel</button>
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="card" style="width: 85%; border-radius: 16px;">
            <p>Type <b>DELETE</b> to delete all:</p>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:15px;">
                <input type="text" id="deleteInput" placeholder="Type DELETE here" style="margin:0;">
                <button onclick="copyDeleteText()" style="width: 50px; background: #64748b; margin:0;">📋</button>
            </div>
            <button onclick="confirmDelete()" style="background: var(--danger);">Delete All</button>
            <button onclick="closeModal('deleteModal')" style="background: #94a3b8; margin-top:10px;">Cancel</button>
        </div>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('myApps')) || [];
        function showImportModal() { document.getElementById('importModal').style.display = 'flex'; }
        function showDeleteModal() { document.getElementById('deleteModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function importJSON() {
            try { data = JSON.parse(document.getElementById('importArea').value); render(); closeModal('importModal'); } 
            catch(e) { alert("Invalid JSON"); }
        }

        function addUrlField() {
            const row = document.createElement('div'); row.className = 'url-row';
            row.innerHTML = '<input type="text" class="url-input" placeholder="Extra URL">';
            document.getElementById('url-container').appendChild(row);
        }

        function saveItem() {
            const index = document.getElementById('editIndex').value;
            const name = document.getElementById('name').value;
            if(!name) return alert("Name is required!");
            const urls = Array.from(document.querySelectorAll('.url-input')).map(i => i.value).filter(v => v);
            const item = { name, dis: document.getElementById('dis').value, img: document.getElementById('img').value, urls };
            if (index == -1) data.push(item); else data[index] = item;
            resetForm(); render();
        }

        function resetForm() {
            document.getElementById('editIndex').value = -1;
            document.getElementById('name').value = '';
            document.getElementById('dis').value = '';
            document.getElementById('img').value = '';
            document.getElementById('url-container').innerHTML = `
                <div class="url-row"><input type="text" class="url-input" placeholder="URL 1"></div>
                <div class="url-row"><input type="text" class="url-input" placeholder="URL 2"></div>
                <div class="url-row"><input type="text" class="url-input" placeholder="URL 3"><button onclick="addUrlField()" class="plus-btn">+</button></div>`;
            document.getElementById('saveBtn').innerText = "Add to List";
        }

        function render() {
            const list = document.getElementById('app-list'); list.innerHTML = '';
            data.forEach((item, index) => {
                const div = document.createElement('div'); div.className = 'item';
                div.innerHTML = `<strong>${item.name}</strong> <div>
                    <button onclick="editItem(${index})" style="background:#f59e0b; width:auto; padding:8px 12px; margin-right:5px;">Edit</button>
                    <button onclick="del(${index})" style="background:var(--danger); width:auto; padding:8px 12px;">X</button></div>`;
                list.appendChild(div);
            });
            localStorage.setItem('myApps', JSON.stringify(data));
        }

        function editItem(index) {
            const item = data[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('name').value = item.name;
            document.getElementById('dis').value = item.dis;
            document.getElementById('img').value = item.img;
            document.getElementById('url-container').innerHTML = '';
            item.urls.forEach(url => {
                const row = document.createElement('div'); row.className = 'url-row';
                row.innerHTML = `<input type="text" class="url-input" value="${url}">`;
                document.getElementById('url-container').appendChild(row);
            });
            while(document.querySelectorAll('.url-input').length < 3) addUrlField();
            document.getElementById('saveBtn').innerText = "Update Item";
            window.scrollTo(0, 0);
        }

        function del(idx) { if(confirm('Delete?')) { data.splice(idx, 1); render(); } }
        function copyDeleteText() { navigator.clipboard.writeText("DELETE"); }
        function confirmDelete() {
            const val = document.getElementById('deleteInput').value;
            if (val === "DELETE") { data = []; localStorage.removeItem('myApps'); render(); closeModal('deleteModal'); document.getElementById('deleteInput').value = ''; }
            else { alert("Incorrect text!"); }
        }
        function generateJSON() { document.getElementById('output').innerText = JSON.stringify(data, null, 2); }
        function copyToClipboard() { navigator.clipboard.writeText(document.getElementById('output').innerText).then(() => alert("Copied!")); }
        
        render();
    </script>
</body>
</html>
