<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Editor Pro</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f4f9; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 12px; cursor: pointer; border: none; border-radius: 4px; width: 100%; margin-top: 5px; color: white; font-weight: bold; }
        .item { background: #fff; padding: 10px; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #007bff; }
        pre { background: #333; color: #0f0; padding: 10px; overflow-x: auto; border-radius: 4px; font-size: 12px; }
        .btn-add { background: #007bff; }
        .btn-edit { background: orange; width: auto; padding: 5px; }
        .btn-del { background: red; width: auto; padding: 5px; }
        .btn-danger { background: #dc3545; margin-top: 30px; }
    </style>
</head>
<body>

    <h3>Import Existing JSON</h3>
    <textarea id="importArea" rows="3" placeholder="Paste your existing JSON here..."></textarea>
    <button onclick="importJSON()" style="background: #28a745;">Load to List</button>

    <h3>Editor</h3>
    <input type="hidden" id="editIndex" value="-1">
    <input type="text" id="name" placeholder="Name">
    <input type="text" id="dis" placeholder="Description">
    <input type="text" id="img" placeholder="Image URL">
    <div id="url-container">
        <input type="text" class="url-input" placeholder="URL 1">
        <input type="text" class="url-input" placeholder="URL 2">
        <input type="text" class="url-input" placeholder="URL 3">
    </div>
    <button onclick="addUrlField()" style="background: #6c757d;">+ Add another URL</button>
    <button id="saveBtn" onclick="saveItem()" class="btn-add">Add to List</button>

    <h3>App List</h3>
    <div id="app-list"></div>

    <button onclick="generateJSON()" style="background: #333; margin-top: 20px;">Generate JSON Script</button>
    <button onclick="copyToClipboard()" style="background: #666;">Copy to Clipboard</button>
    <pre id="output"></pre>

    <button onclick="showDeleteModal()" class="btn-danger">Delete All</button>

    <div id="deleteModal" style="display:none; position:fixed; top:20%; left:5%; width:90%; background:white; padding:20px; border:1px solid #ccc; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.3); z-index:100;">
        <p>Type <b>DELETE</b> to delete all:</p>
        <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
            <input type="text" id="deleteInput" placeholder="Type DELETE here">
            <button onclick="copyDeleteText()" style="width: auto; background: #6c757d;">📋</button>
        </div>
        <button onclick="confirmDelete()" style="background: #dc3545;">Delete All</button>
        <button onclick="closeModal()" style="background: #666; margin-top:10px;">Cancel</button>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('myApps')) || [];

        function importJSON() {
            try { data = JSON.parse(document.getElementById('importArea').value); render(); } 
            catch(e) { alert("Invalid JSON format"); }
        }

        function addUrlField() {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'url-input';
            input.placeholder = 'Extra URL';
            document.getElementById('url-container').appendChild(input);
        }

        function saveItem() {
            const index = document.getElementById('editIndex').value;
            const name = document.getElementById('name').value;
            if(!name) return alert("Name is required!");
            
            const urls = Array.from(document.querySelectorAll('.url-input'))
                              .map(i => i.value).filter(v => v);
            
            const item = { name, dis: document.getElementById('dis').value, img: document.getElementById('img').value, urls };
            if (index == -1) data.push(item);
            else data[index] = item;

            resetForm(); render();
        }

        function editItem(index) {
            const item = data[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('name').value = item.name;
            document.getElementById('dis').value = item.dis;
            document.getElementById('img').value = item.img;
            document.getElementById('url-container').innerHTML = '';
            item.urls.forEach(url => {
                const input = document.createElement('input');
                input.className = 'url-input';
                input.value = url;
                document.getElementById('url-container').appendChild(input);
            });
            while(document.querySelectorAll('.url-input').length < 3) addUrlField();
            document.getElementById('saveBtn').innerText = "Update Item";
            window.scrollTo(0, 0);
        }

        function resetForm() {
            document.getElementById('editIndex').value = -1;
            document.getElementById('name').value = '';
            document.getElementById('dis').value = '';
            document.getElementById('img').value = '';
            document.getElementById('url-container').innerHTML = `
                <input type="text" class="url-input" placeholder="URL 1">
                <input type="text" class="url-input" placeholder="URL 2">
                <input type="text" class="url-input" placeholder="URL 3">`;
            document.getElementById('saveBtn').innerText = "Add to List";
        }

        function render() {
            const list = document.getElementById('app-list');
            list.innerHTML = '';
            data.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<strong>${item.name}</strong>
                    <div>
                        <button onclick="editItem(${index})" class="btn-edit">Edit</button>
                        <button onclick="del(${index})" class="btn-del">X</button>
                    </div>`;
                list.appendChild(div);
            });
            localStorage.setItem('myApps', JSON.stringify(data));
        }

        function del(idx) { if(confirm('Delete this item?')) { data.splice(idx, 1); render(); } }

        function showDeleteModal() { document.getElementById('deleteModal').style.display = 'block'; }
        function closeModal() { document.getElementById('deleteModal').style.display = 'none'; }
        function copyDeleteText() { navigator.clipboard.writeText("DELETE").then(() => alert("Copied 'DELETE' to clipboard!")); }
        function confirmDelete() {
            const val = document.getElementById('deleteInput').value;
            if (val === "DELETE") { data = []; localStorage.removeItem('myApps'); render(); closeModal(); document.getElementById('deleteInput').value = ''; }
            else { alert("Incorrect text! Please type DELETE exactly."); }
        }

        function generateJSON() { document.getElementById('output').innerText = JSON.stringify(data, null, 2); }
        function copyToClipboard() { navigator.clipboard.writeText(document.getElementById('output').innerText).then(() => alert("Copied!")); }

        render();
    </script>
</body>
</html>
